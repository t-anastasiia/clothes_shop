name: iOS CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
        - uses: actions/checkout@v4
        
        - name: Select Xcode
          run: sudo xcode-select -switch /Applications/Xcode.app
          
        - name: Build
            run: xcodebuild clean build -project clothes_shop.xcodeproj -scheme clothes_shop -destination 'platform=iOS Simulator,name=iPhone 15'
            
        - name: Run tests
          run: xcodebuild test -project clothes_shop.xcodeproj -scheme clothes_shop -destination 'platform=iOS Simulator,name=iPhone 15'
